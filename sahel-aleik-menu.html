<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>سهل عليك | المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0F3D3E;
    --bg-deep-2:#123f3d;
    --surface:#FBF8F1;
    --surface-2:#F2ECDC;
    --ink:#12312B;
    --muted:#5b6f68;
    --citrus:#F2A93B;
    --tomato:#D6482F;
    --leaf:#4C8C4A;
    --leaf-dark:#356938;
    --line: rgba(18,49,43,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 15% 0%, var(--bg-deep-2), var(--bg-deep) 55%) fixed;
    font-family:'Cairo',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:100px;
  }
  h1,h2,h3,.display{font-family:'El Messiri',serif;}

  /* ---------- Header ---------- */
  header{
    padding:34px 20px 26px;
    text-align:center;
    color:var(--surface);
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 85% -10%, rgba(242,169,59,0.25), transparent 45%),
      radial-gradient(circle at 5% 110%, rgba(76,140,74,0.3), transparent 40%);
    pointer-events:none;
  }
  .eyebrow{
    display:inline-block;
    font-size:13px;
    letter-spacing:.5px;
    background:rgba(251,248,241,0.12);
    border:1px solid rgba(251,248,241,0.3);
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:14px;
  }
  header h1{
    font-size:clamp(34px,8vw,52px);
    margin:0 0 6px;
    font-weight:900;
    color:var(--surface);
  }
  header p{
    margin:0 auto;
    max-width:420px;
    color:rgba(251,248,241,0.8);
    font-size:15px;
    line-height:1.7;
  }
  .areas{
    margin-top:16px;
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .area-pill{
    font-size:12.5px;
    background:rgba(251,248,241,0.1);
    border:1px solid rgba(251,248,241,0.25);
    padding:5px 12px;
    border-radius:999px;
    color:var(--surface);
  }

  /* ---------- Sticky nav ---------- */
  .nav-wrap{
    position:sticky; top:0; z-index:30;
    background:var(--bg-deep);
    box-shadow:0 8px 20px -12px rgba(0,0,0,0.6);
    padding:12px 16px 10px;
  }
  .search{
    max-width:560px; margin:0 auto 12px;
    position:relative;
  }
  .search input{
    width:100%;
    padding:12px 44px 12px 16px;
    border-radius:14px;
    border:1px solid rgba(251,248,241,0.2);
    background:rgba(251,248,241,0.08);
    color:var(--surface);
    font-family:'Cairo',sans-serif;
    font-size:15px;
    outline:none;
  }
  .search input::placeholder{color:rgba(251,248,241,0.5);}
  .search input:focus{border-color:var(--citrus);}
  .search svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    opacity:.6;
  }
  .tabs{
    max-width:560px; margin:0 auto;
    display:flex; gap:8px; overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    display:flex; align-items:center; gap:7px;
    background:transparent;
    border:1px solid rgba(251,248,241,0.25);
    color:rgba(251,248,241,0.85);
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:9px 16px;
    border-radius:12px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .18s ease;
  }
  .tab .ic{font-size:18px;}
  .tab.active{
    background:var(--citrus);
    border-color:var(--citrus);
    color:#3a2200;
  }
  .tab:focus-visible{outline:2px solid var(--surface); outline-offset:2px;}

  /* ---------- Product grid ---------- */
  main{
    max-width:760px;
    margin:22px auto 0;
    padding:0 16px;
  }
  .section-title{
    color:var(--surface);
    font-size:22px;
    margin:26px 4px 14px;
    display:flex; align-items:center; gap:10px;
  }
  .section-title span.tag{
    font-size:12px;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    background:rgba(251,248,241,0.12);
    color:rgba(251,248,241,0.75);
    padding:3px 10px;
    border-radius:999px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
  }
  .card{
    background:var(--surface);
    border-radius:18px;
    padding:16px 14px 14px;
    position:relative;
    box-shadow:0 10px 24px -14px rgba(0,0,0,0.5);
    display:flex; flex-direction:column;
    min-height:190px;
  }
  .card .ic{
    font-size:34px;
    line-height:1;
    margin-bottom:8px;
  }
  .card h3{
    margin:0 0 2px;
    font-size:16.5px;
    color:var(--ink);
  }
  .card .unit{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .stamp{
    position:absolute;
    top:12px; left:12px;
    background:var(--surface);
    border:2px dashed var(--tomato);
    color:var(--tomato);
    font-family:'El Messiri',serif;
    font-weight:800;
    font-size:12.5px;
    border-radius:50%;
    width:56px; height:56px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    transform:rotate(-9deg);
    line-height:1.1;
  }
  .card.fruit .stamp{border-color:var(--citrus); color:var(--citrus-dark, #8a5a10);}
  .card.fish .stamp{border-color:var(--leaf-dark); color:var(--leaf-dark);}

  .size-select{
    margin-bottom:10px;
  }
  .size-select select{
    width:100%;
    font-family:'Cairo',sans-serif;
    font-size:13.5px;
    padding:7px 8px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
  }

  .qty-row{
    margin-top:auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
  }
  .stepper{
    display:flex; align-items:center;
    background:var(--surface-2);
    border-radius:10px;
    overflow:hidden;
  }
  .stepper button{
    border:none; background:transparent;
    width:30px; height:30px;
    font-size:17px;
    color:var(--leaf-dark);
    cursor:pointer;
    font-family:'Cairo',sans-serif;
  }
  .stepper button:active{background:var(--line);}
  .stepper .val{
    width:26px; text-align:center;
    font-weight:700; font-size:14px;
  }
  .add-btn{
    background:var(--leaf);
    color:var(--surface);
    border:none;
    padding:8px 14px;
    border-radius:10px;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  .add-btn:hover{background:var(--leaf-dark);}
  .add-btn:active{transform:scale(.95);}
  .add-btn.added{background:var(--tomato);}
  .empty-msg{
    color:rgba(251,248,241,0.7);
    text-align:center;
    padding:30px 10px;
    font-size:15px;
  }

  /* ---------- Footer ---------- */
  footer{
    max-width:760px; margin:50px auto 0; padding:24px 20px 10px;
    text-align:center;
    color:rgba(251,248,241,0.65);
    font-size:13px;
    border-top:1px solid rgba(251,248,241,0.15);
  }
  footer a{color:var(--citrus); text-decoration:none; font-weight:700;}

  /* ---------- Floating cart button ---------- */
  .cart-fab{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    z-index:40;
    background:var(--citrus);
    color:#3a2200;
    border:none;
    border-radius:16px;
    padding:13px 22px;
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:15px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 14px 30px -10px rgba(0,0,0,0.6);
    cursor:pointer;
    transition:transform .15s ease;
  }
  .cart-fab:active{transform:translateX(-50%) scale(.97);}
  .cart-fab .count{
    background:var(--tomato);
    color:#fff;
    border-radius:999px;
    min-width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px;
    padding:0 6px;
  }
  .cart-fab[hidden]{display:none;}

  /* ---------- Cart drawer ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,25,22,0.55);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; z-index:60;
    left:0; right:0; bottom:0;
    max-width:520px; margin:0 auto;
    background:var(--surface);
    border-radius:22px 22px 0 0;
    padding:20px 20px 18px;
    transform:translateY(105%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:82vh;
    display:flex; flex-direction:column;
  }
  .drawer.open{transform:translateY(0);}
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .drawer-head h2{margin:0; font-size:21px; color:var(--ink);}
  .close-btn{
    background:var(--surface-2); border:none; border-radius:10px;
    width:34px; height:34px; font-size:16px; cursor:pointer; color:var(--ink);
  }
  .cart-list{
    overflow-y:auto; flex:1;
    display:flex; flex-direction:column; gap:10px;
    padding-bottom:6px;
  }
  .cart-item{
    display:flex; align-items:center; gap:10px;
    background:var(--surface-2);
    border-radius:14px;
    padding:10px 12px;
  }
  .cart-item .ic{font-size:24px;}
  .cart-item .info{flex:1; min-width:0;}
  .cart-item .info h4{margin:0; font-size:14.5px;}
  .cart-item .info .meta{font-size:12px; color:var(--muted);}
  .cart-item .price{font-weight:800; font-size:13.5px; white-space:nowrap;}
  .cart-item .remove{
    background:none; border:none; color:var(--tomato);
    font-size:18px; cursor:pointer; padding:0 4px;
  }
  .cart-empty{
    text-align:center; color:var(--muted); padding:30px 0; font-size:14.5px;
  }
  .cart-total{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px 6px;
    border-top:1px dashed var(--line);
    margin-top:8px;
    font-size:17px; font-weight:800;
  }
  .whatsapp-btn{
    margin-top:10px;
    width:100%;
    background:#25D366;
    color:#08320f;
    border:none;
    padding:14px;
    border-radius:14px;
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:15.5px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
  }
  .whatsapp-btn:disabled{opacity:.5; cursor:not-allowed;}
  .drawer-note{
    font-size:11.5px; color:var(--muted); text-align:center; margin-top:8px;
  }

  @media (max-width:380px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <span class="eyebrow">توصيل يومي طازة</span>
  <h1>سهل عليك</h1>
  <p>خضار وفاكهة وسمك ودواجن، طازة من السوق لباب البيت.</p>
  <div class="areas">
    <span class="area-pill">برج البرلس</span>
    <span class="area-pill">الساحل</span>
    <span class="area-pill">بلطيم</span>
  </div>
</header>

<div class="nav-wrap">
  <div class="search">
    <input id="searchInput" type="text" placeholder="ابحث عن صنف... مثلاً طماطم">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<main id="main"></main>

<footer>
  تواصل معنا على <a href="https://www.facebook.com" target="_blank" rel="noopener">فيسبوك</a> — الأسعار قابلة للتغيير حسب السوق يوميًا.
</footer>

<button class="cart-fab" id="cartFab" hidden>
  🧺 السلة <span class="count" id="cartCount">0</span>
</button>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>سلة الطلب</h2>
    <button class="close-btn" id="closeDrawer">✕</button>
  </div>
  <div class="cart-list" id="cartList"></div>
  <div class="cart-total">
    <span>الإجمالي</span>
    <span id="cartTotal">0 جنيه</span>
  </div>
  <button class="whatsapp-btn" id="waBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#08320f"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5C10 9.4 9.4 8 9.2 7.5c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.3 0 1.4 1 2.7 1.1 2.9.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.7.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.5-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.4 5.1L2 22l5.1-1.3c1.4.8 3.1 1.2 4.9 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.3.9.9-3.2-.2-.3C3.9 14.9 3.5 13.5 3.5 12 3.5 7.3 7.3 3.5 12 3.5s8.5 3.8 8.5 8.5-3.8 8.2-8.5 8.2z"/></svg>
    إرسال الطلب على واتساب
  </button>
  <div class="drawer-note">هتتفتح رسالة جاهزة في واتساب، اكتب عنوانك وابعتها.</div>
</div>

<script>
/* ============ إعدادات ============ */
// عدّل الرقم ده برقم واتساب النشاط بصيغة دولية بدون + أو أصفار زيادة
const WHATSAPP_NUMBER = "201023381627";

/* ============ بيانات المنتجات ============ */
const CATEGORIES = [
  { id: "veg", label: "خضروات", icon: "🥬" },
  { id: "fruit", label: "فواكه", icon: "🍉" },
  { id: "fish", label: "سمك ودواجن", icon: "🐟" },
];

const PRODUCTS = [
  { id:"tomato", cat:"veg", name:"طماطم", icon:"🍅", unit:"الكيلو", price:15 },
  { id:"cucumber", cat:"veg", name:"خيار", icon:"🥒", unit:"الكيلو", price:12 },
  { id:"potato", cat:"veg", name:"بطاطس", icon:"🥔", unit:"الكيلو", price:18 },
  { id:"eggplant", cat:"veg", name:"باذنجان", icon:"🍆", unit:"الكيلو", price:14 },
  { id:"pepper", cat:"veg", name:"فلفل ألوان", icon:"🫑", unit:"الكيلو", price:20 },
  { id:"zucchini", cat:"veg", name:"كوسة", icon:"🥒", unit:"الكيلو", price:13 },
  { id:"onion", cat:"veg", name:"بصل", icon:"🧅", unit:"الكيلو", price:10 },

  { id:"watermelon", cat:"fruit", name:"بطيخ", icon:"🍉", unit:"حسب الحجم",
    variants:[
      { label:"حبة صغيرة", price:25 },
      { label:"حبة وسط", price:40 },
      { label:"حبة كبيرة", price:60 },
    ]
  },
  { id:"banana", cat:"fruit", name:"موز", icon:"🍌", unit:"الكيلو", price:22 },
  { id:"grapes", cat:"fruit", name:"عنب", icon:"🍇", unit:"الكيلو", price:35 },
  { id:"apple", cat:"fruit", name:"تفاح", icon:"🍎", unit:"الكيلو", price:30 },
  { id:"mango", cat:"fruit", name:"مانجو", icon:"🥭", unit:"الكيلو", price:38 },
  { id:"orange", cat:"fruit", name:"برتقال", icon:"🍊", unit:"الكيلو", price:16 },

  { id:"talapia", cat:"fish", name:"بلطي", icon:"🐟", unit:"الكيلو", price:55 },
  { id:"boury", cat:"fish", name:"بوري", icon:"🐟", unit:"الكيلو", price:70 },
  { id:"baladi-chicken", cat:"fish", name:"فراخ بلدي", icon:"🐔", unit:"الفرخة", price:180 },
  { id:"white-chicken", cat:"fish", name:"فراخ بيضاء", icon:"🐔", unit:"الكيلو", price:65 },
];

/* ============ حالة التطبيق ============ */
let activeCat = "veg";
let searchTerm = "";
let cart = {}; // key: id(+variant) -> {name, icon, unit, price, qty}
const qtyState = {}; // id -> selected quantity in card (before adding)
const variantState = {}; // id -> selected variant index

const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");
const cartFab = document.getElementById("cartFab");
const cartCount = document.getElementById("cartCount");
const overlay = document.getElementById("overlay");
const drawer = document.getElementById("drawer");
const cartListEl = document.getElementById("cartList");
const cartTotalEl = document.getElementById("cartTotal");
const waBtn = document.getElementById("waBtn");

/* ============ بناء التابات ============ */
CATEGORIES.forEach(c=>{
  const btn = document.createElement("button");
  btn.className = "tab" + (c.id===activeCat ? " active": "");
  btn.innerHTML = `<span class="ic">${c.icon}</span> ${c.label}`;
  btn.setAttribute("data-cat", c.id);
  btn.onclick = ()=>{ activeCat = c.id; searchTerm=""; document.getElementById("searchInput").value=""; render(); };
  tabsEl.appendChild(btn);
});

document.getElementById("searchInput").addEventListener("input", (e)=>{
  searchTerm = e.target.value.trim();
  render();
});

/* ============ عرض المنتجات ============ */
function currentPrice(p){
  if(p.variants){
    const idx = variantState[p.id] ?? 0;
    return p.variants[idx].price;
  }
  return p.price;
}
function currentLabel(p){
  if(p.variants){
    const idx = variantState[p.id] ?? 0;
    return p.variants[idx].label;
  }
  return p.unit;
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active", t.getAttribute("data-cat")===activeCat);
  });

  let list;
  let title;
  if(searchTerm){
    list = PRODUCTS.filter(p=>p.name.includes(searchTerm));
    title = `نتائج البحث عن "${searchTerm}"`;
  } else {
    list = PRODUCTS.filter(p=>p.cat===activeCat);
    const cat = CATEGORIES.find(c=>c.id===activeCat);
    title = `${cat.icon} ${cat.label}`;
  }

  mainEl.innerHTML = "";
  const h = document.createElement("h2");
  h.className = "section-title";
  h.innerHTML = `${title} <span class="tag">${list.length} صنف</span>`;
  mainEl.appendChild(h);

  if(list.length===0){
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = "مفيش أصناف تطابق بحثك";
    mainEl.appendChild(empty);
    return;
  }

  const grid = document.createElement("div");
  grid.className = "grid";

  list.forEach(p=>{
    if(qtyState[p.id]===undefined) qtyState[p.id]=1;
    const catClass = p.cat==="fruit" ? "fruit" : (p.cat==="fish" ? "fish" : "");
    const card = document.createElement("div");
    card.className = `card ${catClass}`;

    let variantHtml = "";
    if(p.variants){
      variantHtml = `<div class="size-select"><select data-id="${p.id}">
        ${p.variants.map((v,i)=>`<option value="${i}">${v.label} — ${v.price} ج</option>`).join("")}
      </select></div>`;
    }

    card.innerHTML = `
      <div class="stamp">${currentPrice(p)}<br>ج.م</div>
      <div class="ic">${p.icon}</div>
      <h3>${p.name}</h3>
      <div class="unit">${p.variants ? "" : p.unit}</div>
      ${variantHtml}
      <div class="qty-row">
        <div class="stepper">
          <button data-act="dec" data-id="${p.id}">−</button>
          <span class="val" id="val-${p.id}">${qtyState[p.id]}</span>
          <button data-act="inc" data-id="${p.id}">+</button>
        </div>
        <button class="add-btn" data-id="${p.id}">أضف</button>
      </div>
    `;
    grid.appendChild(card);
  });

  mainEl.appendChild(grid);

  // bind events
  grid.querySelectorAll("select[data-id]").forEach(sel=>{
    sel.addEventListener("change",(e)=>{
      variantState[e.target.getAttribute("data-id")] = Number(e.target.value);
      render();
    });
    const id = sel.getAttribute("data-id");
    if(variantState[id]!==undefined) sel.value = variantState[id];
  });

  grid.querySelectorAll(".stepper button").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const id = btn.getAttribute("data-id");
      const act = btn.getAttribute("data-act");
      let v = qtyState[id] ?? 1;
      v = act==="inc" ? v+1 : Math.max(1, v-1);
      qtyState[id]=v;
      document.getElementById(`val-${id}`).textContent = v;
    });
  });

  grid.querySelectorAll(".add-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const id = btn.getAttribute("data-id");
      const p = PRODUCTS.find(pp=>pp.id===id);
      const qty = qtyState[id] ?? 1;
      const price = currentPrice(p);
      const label = currentLabel(p);
      const key = p.variants ? `${id}-${variantState[id]??0}` : id;

      if(cart[key]){
        cart[key].qty += qty;
      } else {
        cart[key] = { name:p.name, icon:p.icon, unit:label, price, qty };
      }
      qtyState[id] = 1;
      document.getElementById(`val-${id}`).textContent = 1;

      btn.classList.add("added");
      btn.textContent = "✓ اتضاف";
      setTimeout(()=>{ btn.classList.remove("added"); btn.textContent="أضف"; }, 900);

      updateCartUI();
    });
  });
}

/* ============ السلة ============ */
function updateCartUI(){
  const keys = Object.keys(cart);
  const totalQty = keys.reduce((s,k)=>s+cart[k].qty,0);
  const totalPrice = keys.reduce((s,k)=>s+cart[k].qty*cart[k].price,0);

  cartFab.hidden = totalQty===0;
  cartCount.textContent = totalQty;
  cartTotalEl.textContent = `${totalPrice} جنيه`;
  waBtn.disabled = totalQty===0;

  cartListEl.innerHTML = "";
  if(keys.length===0){
    cartListEl.innerHTML = `<div class="cart-empty">السلة فاضية، ابدأ اختر أصنافك 🧺</div>`;
    return;
  }
  keys.forEach(k=>{
    const item = cart[k];
    const row = document.createElement("div");
    row.className = "cart-item";
    row.innerHTML = `
      <div class="ic">${item.icon}</div>
      <div class="info">
        <h4>${item.name}</h4>
        <div class="meta">${item.unit} × ${item.qty}</div>
      </div>
      <div class="price">${item.qty*item.price} ج</div>
      <button class="remove" data-key="${k}">✕</button>
    `;
    cartListEl.appendChild(row);
  });
  cartListEl.querySelectorAll(".remove").forEach(btn=>{
    btn.addEventListener("click",()=>{
      delete cart[btn.getAttribute("data-key")];
      updateCartUI();
    });
  });
}

cartFab.addEventListener("click", ()=>{
  overlay.classList.add("open");
  drawer.classList.add("open");
});
function closeCart(){
  overlay.classList.remove("open");
  drawer.classList.remove("open");
}
overlay.addEventListener("click", closeCart);
document.getElementById("closeDrawer").addEventListener("click", closeCart);

waBtn.addEventListener("click", ()=>{
  const keys = Object.keys(cart);
  if(keys.length===0) return;
  let lines = ["مرحباً، عايز أطلب من سهل عليك:", ""];
  let total = 0;
  keys.forEach(k=>{
    const item = cart[k];
    const lineTotal = item.qty*item.price;
    total += lineTotal;
    lines.push(`- ${item.name} (${item.unit}) × ${item.qty} = ${lineTotal} ج`);
  });
  lines.push("");
  lines.push(`الإجمالي: ${total} جنيه`);
  lines.push("");
  lines.push("العنوان: ");

  const text = encodeURIComponent(lines.join("\n"));
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, "_blank");
});

render();
updateCartUI();
</script>
